name: Check site build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Minify JavaScript
        run: |
          npm install -g uglify-js
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Build site
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: Check every publication is listed on the about page and the publications page
        run: |
          set -e
          python - <<'PY'
          import re
          titles = [
              "SynLogic",
              "On the Perception Bottleneck of VLMs for Chart Understanding",
              "On the Universal Truthfulness Hyperplane Inside LLMs",
              "In-Context Sharpness as Alerts",
              "C-Eval",
              "Composing Parameter-Efficient Modules with Arithmetic Operations",
          ]
          for path in ["_site/index.html", "_site/publications/index.html"]:
              html = open(path, encoding="utf-8").read()
              for title in titles:
                  assert title in html, (path, title)
              print(path, "contains all six publications")
          for path in ["_site/index.html", "_site/publications/index.html"]:
              html = open(path, encoding="utf-8").read()
              entries = re.findall(r'<h2 class="archive__item-title"[^>]*>(.*?)</h2>', html, re.S)
              print(path, "publication entries:", len(entries))
              for entry in entries:
                  print(" -", re.sub(r"<[^>]+>", "", entry).strip())
          html = open("_site/publications/index.html", encoding="utf-8").read()
          assert len(re.findall(r'<h2 class="archive__item-title"', html)) == 6
          for text in ["Junteng Liu", "jliugi@connect.ust.hk", "HKUST", "Shanghai Jiao Tong University",
                       "MINIMAX", "Tencent WXG", "Shanghai AI Lab", "Junxian He", "Zifei Shan", "Yu Cheng",
                       "Zhiyuan Honor Scholarship", "Vicent0205", "junteng88716710", "tbK9jl4AAAAJ"]:
              assert text in open("_site/index.html", encoding="utf-8").read(), text
          print("About page contains all academic and contact details")
          PY
      - name: Check publication pages
        run: |
          set -e
          test -f _site/publication/2025-synlogic/index.html
          test -f _site/publication/2025-perception-bottleneck/index.html
          test -f _site/publication/2024-universal-truthfulness-hyperplane/index.html
          test -f _site/publication/2024-in-context-sharpness/index.html
          test -f _site/publication/2023-ceval/index.html
          test -f _site/publication/2023-composing-parameter-efficient-modules/index.html
          echo "Publication checks passed"
      - name: Check that no template placeholder content remains in the built pages
        run: |
          set -e
          if grep -R -l -E "Paper Title Number|Your Name|GitHub University|Red Brick University" _site --include='*.html'; then
            echo "Placeholder content found"
            exit 1
          fi
          echo "No placeholder content found"